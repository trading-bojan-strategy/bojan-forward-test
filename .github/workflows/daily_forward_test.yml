name: Daily Forward Test

on:
  schedule:
    - cron: '22 21 * * *'  # Täglich 21:22 UTC (22:22 CET = nach US-Close)
  workflow_dispatch:  # Manuell klick-bar

jobs:
  forward-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run Forward Test
      run: python forward_test.py
    
    - name: Commit results
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add forward_test_results.csv || echo "Keine CSV vorhanden"
        git commit -m "Forward test results - $(date)" || echo "No changes"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
